# contracts/events.toml — the tokenizer of machine experience (v0 placeholders)
# Pre-registered: changing a threshold = a D-entry in DECISIONS.md.
# The plant earns tokens only by surprising its cerebellum (innovation) or crossing a
# named line. Nominal = ticks. Budget law: nominal hour <= ~100 tokens.

[innovation]
# QC fix (CTL-B3 + PHY, independently): per-channel per-sample thresholds fire ~1080
# events/s at 3 sigma — 4-5 orders over budget. Innovation is therefore computed on the
# WINDOWED CLUSTER RESIDUAL (aggregation_window_ms), one event max per cluster per window;
# sustained storms collapse to one "storm" summary event + counter (the flood->rate-cap
# immune row, inherited from fabric.h's self-attack lab).
aggregation_window_ms = 250
sigma_token = 3.0        # windowed cluster residual >= 3 sigma -> one event token
sigma_alarm = 5.0        # >= 5 sigma -> priority event (band should dwell)
storm_collapse_after = 4 # >4 events from one cluster in 10 s -> storm summary + counter
clusters = ["vertical", "radial", "density", "current", "thermal"]

[ticks]
nominal_interval_s = 300 # "[tick +300s nominal Q=...]" — QC fix: 30 s ticks alone were
                         # 12-14x the stated budget; 5-min ticks ~ 96 tok/hr
include_q = true

[limits]                 # proximity events fire at frac_warn, again at frac_alarm
greenwald  = { warn = 0.80, alarm = 0.92 }
q95        = { warn = 2.6,  alarm = 2.35 }   # floor itself lives in floors.toml
beta_n     = { warn = 0.85, alarm = 0.95 }   # fraction of the Troyon-ish limit

[controller]
saturation_min_s = 0.5   # coil saturated longer than this -> event
report_drop_events = true # the cerebellum's own deadline misses always tokenize

[health]
drift_sigma = 1.0        # slow-organ drift threshold (per 5-minute window)

[budget]
# THE single source of truth for the budget law (spec §4.1 prose cites this table).
# Nominal: ticks (~96/hr) + slack => the cap below. Crisis: enforced by the tokenizer;
# overflow collapses to storm summaries, never dropped percepts (the gate rule).
max_tokens_per_hr_nominal = 150
max_tokens_per_s_crisis = 40
