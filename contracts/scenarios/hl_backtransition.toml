# hl_backtransition — M1 (D-042): the confinement collapse the curriculum needs.
# H98 steps to a drawn target (dispersions [disturbance_timing].hl_backtransition_H98,
# 0.70-0.85) at a drawn time, holds dur_s, recovers. The 1-D chi carries it (1/H98);
# the controller must ride the stored-energy crash without tripping the frad gate.
# One of F-SHAPE-1's two named disturbances (with vde_kick).

[meta]
name         = "hl_backtransition"
class        = "curriculum"
description  = "H->L back-transition step; controller rides the confinement crash"
activates_at = "M1"

[phases]
sequence     = ["flat_top"]
duration_s   = 12.0

[initial]
Ip_MA        = 8.5
n_bar_e20    = 3.0
T_keV        = 8.0

[control]
T_set_keV    = 8.0
n_set_e20    = 3.0
q_report_set = 1.7

[vertical]
enabled      = true
vs_on        = true

[disturbances]
events = [ { type = "hl_backtransition", t_lo = 4.0, t_hi = 6.0, dur_s = 1.5 } ]

[pass]
metric       = "survival"
q_min        = 0.8
hold_s       = 5.0
seed_count   = 100
pass_frac    = 0.95
ci           = "wilson95"

[dispersions]
profile      = "default"
