# contracts/floors.toml — the governor (v1; v0.2 revision; deterministic, spine-enforced)
# The mind cannot cross these at ANY autonomy level. Changing a floor = a D-entry.
# Values derive from contracts/machine.toml [limits]/[rates] with deliberate margin —
# floors sit BELOW the machine's boundaries on purpose (every one of them, PHY-21).
# Units in the KEY, floats in the value (P-04). dir = which side is safe.
# activates_at: floors whose measurand does not exist yet are DORMANT, not stubbed (PHY-25).

[plasma]
