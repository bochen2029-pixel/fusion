    # disruptive boundary n_GW (NOT a physical wall — H-mode with pellets exceeds it; PHY-23)
beta_n_max_frac    = { value = 0.90, dir = "below", activates_at = "M1" }  # of troyon_C = 2.8
    # (was 1.0 — zero margin contradicted the Greenwald pattern; PHY-21)
n_min_e20          = { value = 0.36, dir = "above", activates_at = "M0" }  # 1.2 x machine
    # n_min: low density is a hazard too (runaway-prone, L-mode collapse) — PHY addition

[rates]             # at-or-below machine.toml [rates]
ip_ramp_max_MA_per_s   = { value = 0.85, dir = "below", activates_at = "M0" }
n_ramp_max_e20_per_s   = { value = 0.12, dir = "below", activates_at = "M0" }
    # measurand: line-averaged n_bar_e (the interferometer's quantity — PHY-26)

[coils]
